name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format --check
        run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev + all extras
        run: python -m pip install --upgrade pip && pip install ".[dev]"

      - name: Run pytest
        run: pytest --cov=globwarden --cov-report=term-missing

  smoke-test-bare-install:
    name: Smoke test (zero extras)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately install with NO extras — this is the exact command the
      # README's own Quickstart tells a new user to run first. `[dev]` (used
      # by the `test` job above) always pulls in `[all]`, which means the
      # main test job can never catch a regression where an ingestion module
      # hard-imports an optional dependency (pdfplumber/bs4/Pillow) instead
      # of lazily guarding it — exactly the release-blocking bug a fresh
      # integration review caught that six module-level review passes missed,
      # because every one of them tested against a `[dev]`/`[all]` install.
      # This job exists specifically so that bug class can never silently
      # come back.
      - name: Install package with NO extras
        run: python -m pip install --upgrade pip && pip install .

      - name: Smoke test — the exact base-install path the README promises
        run: |
          globwarden --version
          globwarden providers
          globwarden scan demo --provider fake --dry-run
          echo "Get-Alias i*x resolves to Invoke-Expression at runtime." > /tmp/sample.txt
          globwarden scan /tmp/sample.txt --provider fake --dry-run

      - name: Confirm PDF/image scanning fail with a clear, actionable error (not a raw traceback)
        run: |
          set -e
          # Must be REAL, existing files with these extensions so detect_source
          # actually dispatches to from_pdf()/from_image() instead of falling
          # through to "treat the string as literal text" (which wouldn't
          # exercise the lazy-import guard being tested here at all).
          printf '%%PDF-1.4\n%%fake' > /tmp/report.pdf
          printf '\x89PNG\r\n\x1a\nfakepngbytes' > /tmp/notes.png
          for src in /tmp/report.pdf /tmp/notes.png; do
            output=$(globwarden scan "$src" --provider fake --dry-run 2>&1 || true)
            echo "$output" | grep -q 'pip install "globwarden\[' || {
              echo "FAIL: scanning $src without its extra did not name the extra to install"
              echo "$output"
              exit 1
            }
          done

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test, smoke-test-bare-install]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
