name: Publish to PyPI

# Deliberately triggered by a version tag (v0.1.1, v1.0.0, ...), not every push to
# main. PyPI versions are immutable -- you can never overwrite or re-upload a given
# version number once it's published -- so "publish on every commit" would force an
# auto-incrementing version on every push, which is noisy and risks shipping a
# broken/WIP state under a real, permanent version number. The deliberate flow is:
# bump the version in pyproject.toml, commit, tag it (`git tag v0.1.1`), push the
# tag (`git push origin v0.1.1`) -- this workflow does the rest.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # allows a manual re-run from the Actions tab if a publish fails

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: [build]
    runs-on: ubuntu-latest
    # This environment name must exactly match the "Environment name" field you
    # enter when registering the trusted publisher at test.pypi.org -- see
    # CONTRIBUTING.md for the exact values to use.
    environment:
      name: testpypi
      url: https://test.pypi.org/p/globwarden
    permissions:
      id-token: write # required for PyPI's OIDC trusted publishing -- no stored secret needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI gets reused for iterative testing more than real PyPI does, so
          # don't hard-fail just because this exact version was already tried there.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    # This environment name must exactly match the "Environment name" field you
    # enter when registering the trusted publisher at pypi.org -- see
    # CONTRIBUTING.md for the exact values to use.
    environment:
      name: pypi
      url: https://pypi.org/p/globwarden
    permissions:
      id-token: write # required for PyPI's OIDC trusted publishing -- no stored secret needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No skip-existing here on purpose: if this version already exists on real
        # PyPI, that should fail loudly, not silently skip.
